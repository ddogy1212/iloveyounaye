name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android SDK command-line tools.
      # setup-android@v3 fails here while trying to install obsolete package 'tools'.
      - name: Configure and check Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK_DIR"
          ls "$SDK_DIR" || true
          if [ -f "$SDK_DIR/platforms/android-35/android.jar" ] && [ -d "$SDK_DIR/build-tools/35.0.0" ]; then
            echo "Android SDK 35 and Build Tools 35 are already installed"
          else
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMGR" ]; then
              SDKMGR="$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager"
            fi
            if [ ! -x "$SDKMGR" ]; then
              echo "::error::Android SDK manager missing from $SDK_DIR/cmdline-tools"
              exit 1
            fi
            "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iloveyounaye-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.0.0-new-separate-app
          name: 음성위젯 NEW v9 - 새 앱으로 개별 설치
          body: |
            1x1 사진 음성 위젯. 첫 터치는 원래 음성, 둘째 터치는 사용자가 고른 새 음성, 셋째는 다시 원래 음성을 반복합니다.
            새 음성은 앱에서 직접 선택해 기기 내부에 저장하므로 공개 GitHub 저장소나 APK에 개인 음성이 포함되지 않습니다.
            사진 편집 및 1×1 위젯 기능 유지. 새로운 앱 ID: com.iloveyounaye.voicewidgetstandalone2026 (versionCode 1). 기존 앱과 별개로 설치됩니다.
            사용자는 새 앱에서 두 번째 음성을 선택해야 합니다. 원래 설치된 위젯과 사진은 이전 앱에 그대로 남습니다.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
