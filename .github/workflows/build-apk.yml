name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android SDK command-line tools.
      # setup-android@v3 fails here while trying to install obsolete package 'tools'.
      - name: Configure and check Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK_DIR"
          ls "$SDK_DIR" || true
          if [ -f "$SDK_DIR/platforms/android-35/android.jar" ] && [ -d "$SDK_DIR/build-tools/35.0.0" ]; then
            echo "Android SDK 35 and Build Tools 35 are already installed"
          else
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMGR" ]; then
              SDKMGR="$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager"
            fi
            if [ ! -x "$SDKMGR" ]; then
              echo "::error::Android SDK manager missing from $SDK_DIR/cmdline-tools"
              exit 1
            fi
            "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iloveyounaye-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0-live-frame
          name: 음성위젯 v7 - 실시간 사진 틀 편집
          body: |
            1x1 홈 화면 사진 음성 위젯. 사진 위에서 둥근 위젯 모양 틀을 보고 확대, 이동할 수 있습니다.
            드래그 도중 홈 화면 위젯 미리보기 갱신 및 손을 떼면 자동 저장됩니다. 사진 왜곡, 분홍색 여백 없음.
            Android 8.0+ 별도 설치 앱 ID: com.iloveyounaye.voicewidgetliveframe
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
