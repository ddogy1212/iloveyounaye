name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android SDK command-line tools.
      # setup-android@v3 fails here while trying to install obsolete package 'tools'.
      - name: Install platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iloveyounaye-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 나예 사랑해 - Android 1x1 위젯
          body: |
            Android 8.0+ 홈 화면 1×1 하트 위젯. 터치하면 앱을 열지 않고 영상의 목소리가 재생됩니다.
            아래의 app-debug.apk를 휴대전화에서 다운로드하여 설치하세요.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
