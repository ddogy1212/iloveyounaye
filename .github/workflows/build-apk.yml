name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android SDK command-line tools.
      # setup-android@v3 fails here while trying to install obsolete package 'tools'.
      - name: Configure and check Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK_DIR"
          ls "$SDK_DIR" || true
          if [ -f "$SDK_DIR/platforms/android-35/android.jar" ] && [ -d "$SDK_DIR/build-tools/35.0.0" ]; then
            echo "Android SDK 35 and Build Tools 35 are already installed"
          else
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMGR" ]; then
              SDKMGR="$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager"
            fi
            if [ ! -x "$SDKMGR" ]; then
              echo "::error::Android SDK manager missing from $SDK_DIR/cmdline-tools"
              exit 1
            fi
            "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iloveyounaye-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-voicewidget
          name: 음성위젯 - 사진과 음성 v3.0.0
          body: |
            Android 8.0+ 홈 화면 1×1 사진 위젯. 이전 앱과 다른 앱 ID(com.iloveyounaye.voicewidget)이므로 기존 앱 삭제 없이 새로 설치할 수 있습니다. 터치하면 앱을 열지 않고 음성이 재생됩니다.
            아래의 app-debug.apk를 휴대전화에서 다운로드하여 설치하세요.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
